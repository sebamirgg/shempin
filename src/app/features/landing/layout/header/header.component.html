<header class="header" [class.header--solid]="scrolled() || menuOpen()">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <div class="container header__inner">
    <a class="header__brand" href="#inicio" aria-label="Shempin, ir al inicio" (click)="close()">
      <app-logo layout="compact" />
    </a>

    <button
      class="header__toggle"
      type="button"
      aria-controls="nav-principal"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="header__burger" [class.is-open]="menuOpen()" aria-hidden="true"></span>
    </button>

    <nav id="nav-principal" class="header__nav" [class.is-open]="menuOpen()" aria-label="Principal">
      <ul class="header__links">
        @for (link of links; track link.href) {
          <li>
            <a class="header__link" [href]="link.href" (click)="close()">{{ link.label }}</a>
          </li>
        }
      </ul>
      <a appButton="whatsapp" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
        WhatsApp
        <span class="visually-hidden">(se abre en una pestaña nueva)</span>
      </a>
    </nav>
  </div>
</header>
